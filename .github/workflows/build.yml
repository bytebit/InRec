name: Android Build

on:
  push:
    branches: [ master, main ]  # 同时支持master和main分支
  pull_request:
    branches: [ master, main ]  # 同时支持master和main分支

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'adopt'

    - name: Build with Gradle
      run: gradle build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
